<div class="cadastroContainer">
  <h2>{{cafeteriaId ? 'Editar Cafeteria' : 'Nova Cafeteria'}}</h2>

  <div class="alert alert-danger" *ngIf="errorList.length > 0">
    <ul class="mb-0">
      <li *ngFor="let erro of errorList">{{erro}}</li>
    </ul>
  </div>

  <form (ngSubmit)="salvar()">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input id="nome" type="text" class="form-control" [(ngModel)]="item.nome" name="nome"/>
    </div>

    <div class="mb-3">
      <label for="endereco" class="form-label">Endereço</label>
      <div class="d-flex gap-2">
        <input id="endereco" type="text" class="form-control" [(ngModel)]="item.endereco" name="endereco"/>
        <button type="button" class="btn btn-outline-secondary text-nowrap" (click)="buscarCoordenadas()">
          <i class="bi bi-geo-alt"></i> Buscar coordenadas
        </button>
      </div>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label for="lat" class="form-label">Latitude</label>
        <input id="lat" type="number" class="form-control" [(ngModel)]="item.lat" name="lat"/>
      </div>
      <div class="col-6 mb-3">
        <label for="lng" class="form-label">Longitude</label>
        <input id="lng" type="number" class="form-control" [(ngModel)]="item.lng" name="lng"/>
      </div>
    </div>

    <div class="mb-3">
      <label for="categoria" class="form-label">Categoria Principal</label>
      <input id="categoria" type="text" class="form-control" [(ngModel)]="item.categoriaPrincipal" name="categoriaPrincipal" placeholder="Ex: Cafeteria especializada, Padaria, Café colonial..."/>
    </div>

    <div class="mb-3">
      <label for="fotoUrl" class="form-label">URL da Foto</label>
      <input id="fotoUrl" type="text" class="form-control" [(ngModel)]="item.fotoUrl" name="fotoUrl"/>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
