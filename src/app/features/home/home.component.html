
<div class="telasContainer">
  <div class="containerHome">
    <div class="headerContainer">
        <img src="assets/imglogo.png" class="logoCasinha" alt="logo"/>
    </div>
    <div class="propagandaContainer">
      <div class="localizacaoInfo" *ngIf="userLat !== null">
        <i class="bi bi-geo-alt-fill"></i> Usando sua localização atual
      </div>
      <input
        id="buscaCafeteria"
        type="text"
        class="form-control"
        aria-label="Busque por uma cafeteria"
        [(ngModel)]="busca"
        (ngModelChange)="aplicarBusca()"
        placeholder="Busque por uma cafeteria:"
      />
    </div>

    <div *ngFor="let item of filteredCafeterias" class="cafeteriaCard col-lg-6 col-md-12" role="button" tabindex="0" (click)="verDetalhe(item)" (keydown.enter)="verDetalhe(item)">
      <img [src]="item.fotoPrincipal || 'assets/imglogo.png'" alt="foto da cafeteria"/>
      <h3 class="text-center spanName">{{item.nome}}</h3>
      <span class="text-center spanCategoria">{{categoriaLabel(item.categoriaPrincipal)}}</span>
      <span class="text-center spanEndereco">{{enderecoCompleto(item)}}</span>
    </div>

    <div *ngIf="filteredCafeterias.length === 0" class="semResultados">
      Nenhuma cafeteria encontrada.
    </div>
  </div>
</div>
<div class="barColor"></div>
