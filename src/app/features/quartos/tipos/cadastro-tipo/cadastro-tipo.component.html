<div class="modal-header">
  <h5 class="modal-title">
    <i class="bi bi-tag"></i>
    {{ isEdit ? 'Editar Tipo de Quarto' : 'Novo Tipo de Quarto' }}
  </h5>
  <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <!-- Nome -->
  <div class="mb-3">
    <label class="form-label">Nome <span class="text-danger">*</span></label>
    <input type="text" class="form-control" [(ngModel)]="item.name" placeholder="Ex: Standard, Luxo, Suíte">
  </div>

  <!-- Hóspedes -->
  <div class="row mb-3">
    <div class="col-6">
      <label class="form-label">Mín. Hóspedes</label>
      <input type="number" class="form-control" [(ngModel)]="item.minHospedes" min="1" placeholder="1">
    </div>
    <div class="col-6">
      <label class="form-label">Máx. Hóspedes</label>
      <input type="number" class="form-control" [(ngModel)]="item.maxHospedes" min="1" placeholder="2">
    </div>
  </div>

  <!-- Configuração de Camas -->
  <div class="mb-3">
    <label class="form-label">Configuração de Camas</label>
    <div class="bed-list">
      <div *ngFor="let bed of beds; let i = index" class="bed-item">
        <select class="form-select" [(ngModel)]="beds[i].bedType">
          <option value="1">Solteiro</option>
          <option value="2">Beliche</option>
          <option value="3">Casal</option>
          <option value="4">Queen</option>
          <option value="5">King</option>
          <option value="6">Berço</option>
        </select>
        <input type="number" class="form-control" [(ngModel)]="beds[i].quantity" min="1" placeholder="Qtd">
        <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeBed(i)">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mt-2" (click)="addBed()">
      <i class="bi bi-plus-circle"></i> Adicionar cama
    </button>
  </div>

  <!-- Checkboxes -->
  <div class="mb-3">
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="aceitaCamaExtra" [(ngModel)]="item.aceitaCamaExtra">
      <label class="form-check-label" for="aceitaCamaExtra">Aceita cama extra</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="checkbox" id="aceitaBerco" [(ngModel)]="item.aceitaBerco">
      <label class="form-check-label" for="aceitaBerco">Aceita berço</label>
    </div>
  </div>

  <!-- Descrição -->
  <div class="mb-3">
    <label class="form-label">Descrição (opcional)</label>
    <textarea class="form-control" [(ngModel)]="item.descricao" rows="3" placeholder="Descreva as características deste tipo de quarto..."></textarea>
  </div>

  <!-- Erros -->
  <div class="alert alert-danger py-2" *ngIf="errorList.length > 0">
    <div *ngFor="let error of errorList" class="d-flex align-items-center gap-1">
      <i class="bi bi-x-circle"></i> {{ error }}
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
  <button type="button" class="btn btn-primary" (click)="onSalvar()">
    <i class="bi bi-check-circle"></i> {{ isEdit ? 'Salvar alterações' : 'Cadastrar' }}
  </button>
</div>
