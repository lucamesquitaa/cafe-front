<button class="btn-criar-massa" (click)="togglePanel()">
  <i class="bi bi-layers"></i> Criar em Massa
</button>

<div class="massa-panel" *ngIf="showPanel">
  <h5><i class="bi bi-layers"></i> Criar Quartos em Massa</h5>

  <div class="mb-3">
    <label class="form-label">Tipo de Quarto <span class="text-danger">*</span></label>
    <select class="form-select" [(ngModel)]="massaDto.tipoQuartoId">
      <option value="">Selecione...</option>
      <option *ngFor="let tipo of allTipos" [value]="tipo.id">{{ tipo.name }}</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Modo de Geração</label>
    <div class="d-flex gap-3">
      <div class="form-check">
        <input class="form-check-input" type="radio" id="modoRange" name="modoGeracao" value="range" [(ngModel)]="massaDto.modoGeracao">
        <label class="form-check-label" for="modoRange">Range (início a fim)</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" id="modoLista" name="modoGeracao" value="lista" [(ngModel)]="massaDto.modoGeracao">
        <label class="form-check-label" for="modoLista">Lista manual</label>
      </div>
    </div>
  </div>

  <div class="row mb-3" *ngIf="massaDto.modoGeracao === 'range'">
    <div class="col-6">
      <label class="form-label">Número Início</label>
      <input type="number" class="form-control" [(ngModel)]="massaDto.rangeInicio" placeholder="Ex: 101">
    </div>
    <div class="col-6">
      <label class="form-label">Número Fim</label>
      <input type="number" class="form-control" [(ngModel)]="massaDto.rangeFim" placeholder="Ex: 120">
    </div>
  </div>

  <div class="mb-3" *ngIf="massaDto.modoGeracao === 'lista'">
    <label class="form-label">Números (separados por vírgula)</label>
    <input type="text" class="form-control" [(ngModel)]="massaDto.listaManual" placeholder="Ex: 101, 102, 205, 301">
  </div>

  <div class="mb-3">
    <label class="form-label">Andar (opcional)</label>
    <input type="text" class="form-control" [(ngModel)]="massaDto.andar" placeholder="Ex: 1º Andar">
  </div>

  <div class="alert alert-danger py-2" *ngIf="massaErros.length > 0">
    <div *ngFor="let e of massaErros" class="d-flex align-items-center gap-1">
      <i class="bi bi-x-circle"></i> {{ e }}
    </div>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-success" (click)="onCriarMassa()">
      <i class="bi bi-check-circle"></i> Gerar Quartos
    </button>
    <button class="btn btn-outline-secondary" (click)="cancelar()">
      Cancelar
    </button>
  </div>
</div>
